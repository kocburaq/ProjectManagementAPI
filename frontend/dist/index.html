    <script>
      // Tema, ilk boyamadan önce uygulanır; aksi halde koyu temada beyaz bir "flash" oluşur.
      (function () {
        try {
          var stored = localStorage.getItem('pm.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage kapalıysa varsayılan açık tema kullanılır */
        }
      })();
    </script>
